<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Element Shadow Root</title>
</head>
<body>
    <h1>Element Shadow Root</h1>

    <div id="ShadowComponent"></div>

    <div id="ClosedShadowComponent"></div>

    <script>
        // Get the element with the ID ShadowComponent
        const element = document.getElementById('ShadowComponent');

        // Attach a shadow DOM to the element in open mode
        const shadowRoot = element.attachShadow({ mode: 'open' });

        // Create an input element
        const inputElement = document.createElement('input');

        // Set attributes for the input element
        inputElement.setAttribute('title', 'Lorem ipsum dolor');
        inputElement.setAttribute('placeholder', 'Lorem ipsum dolor');
        inputElement.setAttribute('value', 'Lorem ipsum dolor');
        inputElement.setAttribute('type', 'text');
        inputElement.setAttribute('id', 'TextInput');

        // Append the input element to the shadow DOM
        shadowRoot.appendChild(inputElement);

        // Add a second input, so a search for several elements inside the shadow DOM has more than one match
        const secondInputElement = document.createElement('input');

        secondInputElement.setAttribute('title', 'Sit amet');
        secondInputElement.setAttribute('type', 'text');
        secondInputElement.setAttribute('id', 'TextInputSecondary');
        shadowRoot.appendChild(secondInputElement);

        // Attach a shadow DOM in closed mode: the page script cannot read it through element.shadowRoot,
        // while the WebDriver "Get Element Shadow Root" command still returns it
        const closedShadowRoot = document
            .getElementById('ClosedShadowComponent')
            .attachShadow({ mode: 'closed' });
        const closedInputElement = document.createElement('input');

        closedInputElement.setAttribute('title', 'Consectetur adipiscing');
        closedInputElement.setAttribute('type', 'text');
        closedInputElement.setAttribute('id', 'ClosedTextInput');
        closedShadowRoot.appendChild(closedInputElement);
    </script>

</body>
</html>
